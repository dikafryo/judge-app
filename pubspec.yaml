name: judge_app
description: 온라인 심사 시스템(judge.sw4u.kr) 안드로이드 앱. 심사위원·관리자 화면 모두 네이티브.
publish_to: 'none'

# X.Y.Z+build — build_and_publish.sh 가 이 형식을 정규식으로 파싱하므로 형식을 지킬 것.
version: 1.2.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 버전을 고정한 이유: 이 값들이 pub 캐시에 이미 있어 네트워크 없이도 빌드된다.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2   # 인쇄물·업데이트 링크를 시스템 브라우저로 넘긴다

  # 네이티브 심사 화면
  flutter_riverpod: ^2.6.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
